name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: node --test scripts/demo-deploy-guard.test.mjs

  build:
    name: Build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            demo: "false"
          - mode: demo
            demo: "true"
    env:
      # ビルド確認専用。実在の保存先・Secretsを使わず、配信もしない。
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      VITE_DEMO_MODE: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  ci:
    name: CI required
    runs-on: ubuntu-latest
    needs: [checks, build]
    if: always()
    steps:
      - name: Require every check to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success

  deploy:
    name: Deploy public demo
    needs: ci
    # 通常利用検証・読取専用化・公開承認後にのみ、この変数をtrueにする。
    if: >-
      needs.ci.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEMO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-live-demo
      cancel-in-progress: false
    env:
      VITE_DEMO_MODE: "true"
      VITE_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}
      FIREBASE_PROJECT_ID: oshi-saidan
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify demo destination before building
        run: node scripts/demo-deploy-guard.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: oshi-saidan
          channelId: live
          firebaseToolsVersion: 14.9.0
