name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand

  build:
    name: Build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            demo: "false"
          - mode: demo
            demo: "true"
    env:
      # ビルド確認専用。実在の保存先・Secretsを使わず、配信もしない。
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      VITE_DEMO_MODE: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  ci:
    name: CI required
    runs-on: ubuntu-latest
    needs: [checks, build]
    if: always()
    steps:
      - name: Require every check to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success

# 公開準備中は配信しない。
# デモの送信制御・読取専用設定・採用素材・公開先の検証後に、
# mainのCI成功と配信先照合を条件とするlive配信を追加する。
